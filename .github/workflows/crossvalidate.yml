name: Cross-validate against ape

# The committed fixtures in tests/fixtures/ let `cargo test` check six trees
# against ape everywhere, with no R needed. This job runs the same comparison
# over 250 freshly generated trees, which is the deeper check but needs an R
# toolchain, so it is run on purpose rather than on every push.
#
# By hand only, no schedule. A build-or-test job on a timer spends minutes every
# week and reports failures nobody asked for, and nobody is watching when it
# goes wrong. Run it before a release, or after touching anything the distances
# depend on.

on:
  workflow_dispatch:
    inputs:
      trees:
        description: "How many trees to generate"
        required: false
        default: "250"

# Only what it needs: checkout, a build and a comparison script. Nothing here
# writes back to the repository.
permissions:
  contents: read

jobs:
  crossvalidate:
    name: distree vs ape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::ape
            any::phangorn

      - name: Build
        run: cargo build --release

      - name: Cross-validate
        run: Rscript scripts/crossvalidate.R ${{ inputs.trees || 250 }} target/release/distree
