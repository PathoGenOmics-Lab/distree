name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always

# Only what it needs: this checks out the code, builds it and runs the tests,
# and writes nothing back. Declared rather than inherited, because the
# repository default is a setting that can change without anyone revisiting the
# workflows it silently widens.
permissions:
  contents: read

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Test release
        run: cargo test --release
