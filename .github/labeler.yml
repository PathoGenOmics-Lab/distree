# Which part of the project a pull request touches, worked out from the files it
# changes. The labels exist so the issue and pull request lists can answer "what
# is going on in the parser"; applying them by hand is how they stop being
# applied.
#
# The issue forms label their own issues, so this only has to cover pull
# requests.
#
# Format is actions/labeler v5, which is not v4's: a bare list of globs under the
# label name silently matches nothing.

parser:
  - changed-files:
      - any-glob-to-any-file:
          - "src/parser.rs"

distances:
  - changed-files:
      - any-glob-to-any-file:
          - "src/lib.rs"
          - "src/lca.rs"
          - "src/midpoint.rs"
          - "src/tree.rs"

cli:
  - changed-files:
      - any-glob-to-any-file:
          - "src/main.rs"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "mkdocs.yml"
          - "README.md"
          - "requirements-docs.txt"

tests:
  - changed-files:
      - any-glob-to-any-file:
          - "tests/**"
          - "fuzz/**"
          - "scripts/crossvalidate.R"
          - "src/testutil.rs"
          # cargo-mutants' scope and timeouts. Left out at first, so the pull
          # request that tuned them arrived with no label at all, which is the
          # failure this file's own comment warns about one section down.
          - ".cargo/**"

packaging:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/release.yml"
          - "Cargo.toml"
          - "CITATION.cff"

# Everything under .github, not a list of the files there. Naming them one by one
# leaves this file itself uncovered, so the pull request adding a rule arrives
# with no label, which is a small thing that says exactly how the list would age.
ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "scripts/**"
